services:

  # 1. DynamoDB Local: el "simulador" de DynamoDB que corre en el computador
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: franchise-dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

  # 2. Crea la tabla una vez que DynamoDB Local está listo, y termina
  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >
      -c "until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 > /dev/null 2>&1;
      do echo 'Waiting for DynamoDB Local...'; sleep 1; done;
      aws dynamodb describe-table --table-name franchises --endpoint-url http://dynamodb-local:8000 > /dev/null 2>&1
      || aws dynamodb create-table --table-name franchises
      --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S
      --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE
      --billing-mode PAY_PER_REQUEST
      --endpoint-url http://dynamodb-local:8000"

  # 3. Nuestra API
  franchise-api:
    build: .
    container_name: franchise-api
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-east-1
      AWS_DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_DYNAMODB_TABLE_NAME: franchises
    ports:
      - "8080:8080"