AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB table for the Franchise API (single-table design)

Parameters:
  TableName:
    Type: String
    Default: franchises
    Description: Name of the DynamoDB table

Resources:
  FranchisesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: franchise-api

Outputs:
  TableName:
    Description: Name of the DynamoDB table
    Value: !Ref FranchisesTable
  TableArn:
    Description: ARN of the DynamoDB table
    Value: !GetAtt FranchisesTable.Arn